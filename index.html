<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>连连看 - MoonBit + WASM</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .container {
    background: rgba(255, 255, 255, 0.95);
    border-radius: 16px;
    padding: 24px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
  }

  h1 {
    text-align: center;
    color: #4a5568;
    margin-bottom: 16px;
    font-size: 28px;
  }

  .info-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding: 12px 16px;
    background: #f7fafc;
    border-radius: 8px;
  }

  .info-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 15px;
    color: #4a5568;
    font-weight: 500;
  }

  .info-item span {
    color: #667eea;
    font-weight: bold;
    font-size: 18px;
    min-width: 32px;
    text-align: center;
  }

  .controls {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    justify-content: center;
    flex-wrap: wrap;
  }

  button {
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s;
    font-family: inherit;
  }

  .btn-primary {
    background: #667eea;
    color: white;
  }

  .btn-primary:hover {
    background: #5a67d8;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
  }

  .btn-secondary {
    background: #edf2f7;
    color: #4a5568;
  }

  .btn-secondary:hover {
    background: #e2e8f0;
  }

  .game-wrapper {
    position: relative;
    display: inline-block;
  }

  canvas {
    display: block;
    border-radius: 8px;
    background: #edf2f7;
  }

  #overlayCanvas {
    position: absolute;
    top: 0;
    left: 0;
    pointer-events: none;
  }

  .status-msg {
    text-align: center;
    margin-top: 12px;
    font-size: 14px;
    min-height: 20px;
    color: #718096;
  }

  .status-msg.win {
    color: #48bb78;
    font-weight: bold;
    font-size: 18px;
  }

  .status-msg.warn {
    color: #ed8936;
  }

  .loading {
    text-align: center;
    padding: 40px;
    color: #718096;
  }

  .hidden {
    display: none;
  }
</style>
</head>
<body>
  <div id="loading" class="container">
    <div class="loading">
      <h1>🎮 连连看</h1>
      <p style="margin-top: 16px;">正在加载游戏模块...</p>
    </div>
  </div>

  <div id="game" class="container hidden">
    <h1>🎮 连连看</h1>

    <div class="info-bar">
      <div class="info-item">⏱️ 时间: <span id="timer">0</span>s</div>
      <div class="info-item">✨ 进度: <span id="progress">0</span>/<span id="total">0</span></div>
      <div class="info-item">🎯 剩余: <span id="remaining">0</span></div>
    </div>

    <div class="controls">
      <button class="btn-primary" id="btnNew">🔄 新游戏</button>
      <button class="btn-secondary" id="btnShuffle">🔀 洗牌</button>
      <button class="btn-secondary" id="btnHint">💡 提示</button>
    </div>

    <div class="game-wrapper">
      <canvas id="gameCanvas"></canvas>
      <canvas id="overlayCanvas"></canvas>
    </div>

    <div class="status-msg" id="statusMsg">点击两个相同的图案，连线不超过两个拐点即可消除</div>
  </div>

<script src="_build/js/debug/build/lianliankan.js?v=20250615"></script>
<script>
(function() {
  var P = '_M0FP111lianliankan';
  var map = {
    init_game: P + '10init__game',
    find_path: P + '10find__path',
    handle_click: P + '13handle__click',
    is_game_won: P + '13is__game__won',
    has_valid_moves: P + '17has__valid__moves',
    shuffle_board: P + '14shuffle__board',
    get_rows: P + '9get__rows',
    get_cols: P + '9get__cols',
    get_matched_pairs: P + '19get__matched__pairs',
    get_total_pairs: P + '17get__total__pairs',
    get_board_value: P + '17get__board__value',
    get_selected_r: P + '16get__selected__r',
    get_selected_c: P + '16get__selected__c',
    get_board: P + '10get__board',
    path_found: P + '11path__found',
    path_len: P + '9path__len',
    path_point_x: P + '14path__point__x',
    path_point_y: P + '14path__point__y',
    click_get_state: P + '17click__get__state',
    click_get_path: P + '16click__get__path'
  };
  window.LLK = {};
  var ok = 0, fail = 0, failNames = [];
  for (var k in map) {
    var fn = null;
    try { fn = window[map[k]]; } catch(e) {}
    if (!fn) {
      try { fn = eval(map[k]); } catch(e) {}
    }
    if (fn) { window.LLK[k] = fn; ok++; }
    else { fail++; failNames.push(k); console.error('LLK missing:', k, map[k]); }
  }
  console.log('LLK bridge: ' + ok + ' OK, ' + fail + ' missing');
  if (fail > 0) {
    window.__llkError = 'Missing: ' + failNames.join(', ');
  }
})();
</script>
<script src="app.js?v=20250615"></script>
</body>
</html>
